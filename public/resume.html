<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume &mdash; Noibedya Narayan Ray</title>
  <meta name="description" content="Resume for Noibedya Narayan Ray, product designer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <style>
    .resume-bar { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 0; }
    .resume-bar h1 { font-size: 1.4rem; margin: 0; }
    .resume-viewer { width: 100%; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 2rem; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; background: var(--soft); }
    .resume-viewer canvas { max-width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .resume-viewer .resume-loading { padding: 4rem 0; color: var(--grey); }
  </style>
<style>
.nav-toggle{display:none;flex-direction:column;justify-content:space-between;width:24px;height:18px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.nav-toggle span{display:block;width:100%;height:2px;background:#fff;border-radius:2px}
@media(max-width:640px){
  .nav-toggle{display:flex}
  .site-nav .nav-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:#fff;border-bottom:1px solid rgba(0,0,0,.1);padding:8px 28px 16px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .site-nav .nav-links.open{display:flex!important}
  .site-nav .nav-links li{width:100%}
  .site-nav .nav-links a{display:block;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06)}
  .site-nav .nav-links a::after{display:none!important}.site-nav .nav-links a{color:#1a2744!important;font-size:1rem!important;font-weight:400!important}
  .site-nav .nav-inner{position:relative}
}
</style>
</head>
<body>
<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">Noibedya Ray</a>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#work">Work</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="resume.html" class="active">Resume</a></li>
    </ul>
  </div>
</header>
<div class="container">
  <div class="resume-bar">
    <h1>Resume</h1>
    <a class="btn btn-primary" href="resume.pdf" download>Download PDF</a>
  </div>
  <div class="resume-viewer" id="resume-viewer">
    <p class="resume-loading">Loading resume&hellip;</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var viewer = document.getElementById("resume-viewer");
fetch("resume.pdf")
  .then(function(r) { return r.arrayBuffer(); })
  .then(function(d) { return pdfjsLib.getDocument({data: d}).promise; })
  .then(function(pdf) {
    viewer.innerHTML = "";
    for (var i = 1; i <= pdf.numPages; i++) {
      (function(pageNum) {
        pdf.getPage(pageNum).then(function(pg) {
          var scale = Math.min(2, (viewer.clientWidth || 800) / pg.getViewport({scale: 1}).width);
          var vp = pg.getViewport({scale: scale});
          var c = document.createElement("canvas");
          c.width = vp.width;
          c.height = vp.height;
          viewer.appendChild(c);
          pg.render({canvasContext: c.getContext("2d"), viewport: vp});
        });
      })(i);
    }
  })
  .catch(function() {
    viewer.innerHTML = '<p class="resume-loading">Couldn\'t load preview. <a href="resume.pdf" download>Download PDF</a>.</p>';
  });
</script>
<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Noibedya Narayan Ray</span>
    <span>
      <a href="mailto:nnr1011@outlook.com">Email</a>
      <a href="https://www.linkedin.com/in/noibedya" target="_blank" rel="noopener">LinkedIn</a>
    </span>
  </div>
</footer>

<script>(function(){var t=document.querySelector('.nav-toggle'),n=document.querySelector('.nav-links');if(t&&n)t.addEventListener('click',function(){n.classList.toggle('open');t.setAttribute('aria-expanded',n.classList.contains('open'))});})()</script>
</body>
</html>
